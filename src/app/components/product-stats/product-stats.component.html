<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-icon">📦</div>
    <div class="stat-info">
      <h3>{{ totalProducts }}</h3>
      <p>Total Products</p>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">⚠️</div>
    <div class="stat-info">
      <h3>{{ outOfStockCount }}</h3>
      <p>Out of Stock</p>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">💰</div>
    <div class="stat-info">
      <h3>${{ totalProfit.toFixed(2) }}</h3>
      <p>Total Profit</p>
    </div>
  </div>
  <div class="stat-card">
    <div class="stat-icon">🔔</div>
    <div class="stat-info">
      <h3>{{ activeAlerts }}</h3>
      <p>Active Alerts</p>
    </div>
  </div>
</div>
